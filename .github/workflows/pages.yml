name: Validate public site

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate_publication.py"
      - "tests/test_validate_publication.py"
      - "wrangler.jsonc"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate_publication.py"
      - "tests/test_validate_publication.py"
      - "wrangler.jsonc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false

      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate publication boundary
        run: python3 scripts/validate_publication.py

      - name: Validate Cloudflare static-assets deployment
        run: npx --yes wrangler@4.114.0 deploy --dry-run
