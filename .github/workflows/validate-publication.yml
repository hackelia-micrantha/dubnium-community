name: Validate public book

on:
  pull_request:
    paths:
      - "site/docs/**"
      - "scripts/validate_publication.py"
      - "tests/test_validate_publication.py"
      - ".github/workflows/validate-publication.yml"
  push:
    branches: [main]
    paths:
      - "site/docs/**"
      - "scripts/validate_publication.py"
      - "tests/test_validate_publication.py"
      - ".github/workflows/validate-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate publication boundary
        run: python scripts/validate_publication.py

      - name: Validate publication diff scope
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
            | python scripts/validate_publication.py --changed-paths-stdin
