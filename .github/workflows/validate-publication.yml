name: Validate public book

on:
  pull_request:
    paths:
      - "site/docs/**"
      - "scripts/validate_publication.py"
      - "tests/test_validate_publication.py"
      - ".github/workflows/validate-publication.yml"
  push:
    branches: [main]
    paths:
      - "site/docs/**"
      - "scripts/validate_publication.py"
      - "tests/test_validate_publication.py"
      - ".github/workflows/validate-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-book-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate publication boundary
        run: python3 scripts/validate_publication.py

      - name: Validate publication diff scope
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
            | python3 scripts/validate_publication.py --changed-paths-stdin
